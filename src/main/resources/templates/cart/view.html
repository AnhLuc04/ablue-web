<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart – Ablueit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', sans-serif;
        }

        .cart-container {
            max-width: 960px;
            margin: auto;
            padding: 40px 25px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
        }

        .table td, .table th {
            vertical-align: middle;
        }

        .product-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        .btn-checkout {
            background: linear-gradient(to right, #00b09b, #96c93d);
            border: none;
            padding: 12px 30px;
            font-size: 1.05rem;
            border-radius: 12px;
            color: white;
            transition: all 0.3s ease-in-out;
        }

        .btn-checkout:hover {
            opacity: 0.9;
        }

        .empty-cart {
            text-align: center;
            padding: 100px 0;
        }

        .variant-detail {
            font-size: 0.85rem;
            color: #555;
        }

        .sale-price {
            color: #e53935;
            font-weight: 600;
        }

        .regular-price {
            text-decoration: line-through;
            color: #999;
            margin-left: 4px;
            font-size: 0.85rem;
        }

        .total-price-box {
            background: #f1f3f5;
            border-radius: 10px;
            padding: 20px;
        }

        #checkout-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px 15px;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
<freame (
<div class="container cart-container mt-5 mb-5">
    <h2 class="mb-4 text-center fw-bold"><i class="bi bi-cart4 me-2"></i>Your Shopping Cart</h2>

    <div th:if="${cartItems.size() == 0}" class="empty-cart">
        <h3>Your cart is currently empty.</h3>
        <a th:href="@{/products}" class="btn btn-outline-primary mt-3">Continue Shopping</a>
    </div>

    <div th:if="${cartItems.size() > 0}">
        <div class="table-responsive mb-4">
            <table class="table table-borderless table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Selected</th>
                    <th>Product</th>
                    <th>Variant</th>
                    <th class="text-end">Price</th>
                    <th class="text-center">Qty</th>
                    <th class="text-end">Subtotal</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cartItems}">
                    <td>
                        <input type="checkbox" class="form-check-input cart-select" th:attr="data-id=${item.id}">
                    </td>
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <div>
                                <div th:text="${item.variation.product.name}" class="fw-semibold">Product name</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="variant-detail" th:if="${item.variation != null}">
                            <span th:each="attr, stat : ${item.variation.attributes}">
                                <span th:if="${attr.attributeTerm != null}" th:text="${attr.attributeTerm.name}">Attr</span>
                                <span th:if="${!stat.last}"> / </span>
                            </span>
                        </div>
                    </td>
                    <td class="text-end">
                        <span th:if="${item.variation.salePrice < item.variation.regularPrice}">
                            <span class="sale-price" th:text="${item.variation.salePrice}">0.00</span>
                            <span class="regular-price" th:text="${item.variation.regularPrice}">0.00</span>
                        </span>
                        <span th:unless="${item.variation.salePrice < item.variation.regularPrice}" th:text="${item.variation.price}">0.00</span>
                    </td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center align-items-center gap-2">
                            <button class="btn btn-sm btn-outline-secondary px-2 py-0" type="button"
                                    th:onclick="'updateQuantity(' + ${item.id} + ', -1)'">−</button>
                            <span class="px-2" th:id="'qty-' + ${item.id}" th:text="${item.quantity}">1</span>
                            <button class="btn btn-sm btn-outline-secondary px-2 py-0" type="button"
                                    th:onclick="'updateQuantity(' + ${item.id} + ', 1)'">+</button>
                        </div>
                    </td>
                    <td class="text-end fw-semibold">
                        $<span th:text="${item.getSubtotal()}">0.00</span>
                    </td>
                    <td>
                        <button type="button"
                                class="btn btn-outline-danger btn-sm rounded-circle btn-remove"
                                th:attr="data-id=${item.variation.id}"
                                title="Remove item">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="total-price-box mb-4">
            <div class="text-end mb-3">
                <h4 class="fw-bold">
                    Total: <span id="total-price"
                                 th:text="'$' + ${#numbers.formatDecimal(total, 1, 'NONE', 1, 'POINT')}">0.00</span>
                </h4>
                <h5 id="discount-info" class="text-success mt-2"></h5>
            </div>
        </div>

        <div class="input-group mt-3 mb-4">
            <select id="discount-select" class="form-select">
                <option value="">-- Select Discount Code --</option>
            </select>
            <button id="apply-discount" class="btn btn-outline-success">Apply</button>
        </div>

        <div id="checkout-message" class="alert alert-danger mt-3" role="alert"></div>

        <div class="d-flex justify-content-end">
            <button type="button" class="btn btn-checkout" id="checkout-selected">
                Proceed to Checkout
            </button>
        </div>
    </div>
</div>

<script>
    function updateQuantity(itemId, change) {
        const qtySpan = document.getElementById('qty-' + itemId);
        let currentQty = parseInt(qtySpan.innerText);
        const newQty = Math.max(currentQty + change, 1);

        fetch('/cart/update-quantity?itemId=' + itemId + '&quantity=' + newQty, {
            method: 'POST'
        })
        .then(res => {
            if (res.ok) {
                location.reload();
            }
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".btn-remove").forEach(btn => {
            btn.addEventListener("click", () => {
                const itemId = btn.getAttribute("data-id");

                fetch('/cart/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ itemId: itemId })
                }).then(res => {
                    if (res.ok) location.reload();
                });
            });
        });

        const btn = document.getElementById("checkout-selected");
        const messageBox = document.getElementById("checkout-message");

        btn.addEventListener("click", function (event) {
            const selected = document.querySelectorAll(".cart-select:checked");

            if (selected.length === 0) {
                event.preventDefault();
                messageBox.textContent = "Please select at least one item to checkout.";
                messageBox.style.display = "block";

                setTimeout(() => {
                    messageBox.style.display = "none";
                }, 3000);
                return;
            }

            messageBox.style.display = "none";

            const selectedIds = Array.from(selected).map(cb => cb.getAttribute("data-id"));
            const totalElement = document.getElementById("total-price");
            const rawTotal = totalElement ? totalElement.textContent.replace(/[^\d.]/g, '') : "0";
            const total = parseFloat(rawTotal);

            event.preventDefault();
            const form = document.createElement("form");
            form.method = "POST";
            form.action = "/cart/checkout-selected";

            selectedIds.forEach(id => {
                const input = document.createElement("input");
                input.type = "hidden";
                input.name = "itemIds";
                input.value = id;
                form.appendChild(input);
            });

            const totalInput = document.createElement("input");
            totalInput.type = "hidden";
            totalInput.name = "total";
            totalInput.value = total;
            form.appendChild(totalInput);

            document.body.appendChild(form);
            form.submit();
        });
    });
</script>

</body>
</html>
