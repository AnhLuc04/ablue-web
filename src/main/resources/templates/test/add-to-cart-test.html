<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test Thêm Giỏ Hàng</title>
</head>
<body>
<h1>Thêm sản phẩm vào giỏ hàng</h1>

<form action="/cart/add" method="post">
    <label for="variantId">Variant ID:</label>
    <input type="number" id="variantId" name="variantId" value="123" required><br><br>

    <label for="quantity">Số lượng:</label>
    <input type="number" id="quantity" name="quantity" value="1" required><br><br>

    <button type="submit">Thêm vào giỏ</button>
</form>
</body>
</html>
