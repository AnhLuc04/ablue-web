<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout – Ablueit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Select2 CSS + JS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f6f8;
      font-family: 'Segoe UI', sans-serif;
    }
    .checkout-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 30px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    .checkout-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .summary-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 20px;
    }
    .btn-confirm {
      background: linear-gradient(to right, #00b09b, #96c93d);
      color: white;
      font-weight: bold;
      border: none;
    }
    .form-section {
      margin-bottom: 25px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container checkout-container">
  <div class="checkout-header">
    <h2><i class="bi bi-truck me-2"></i>Checkout</h2>
  </div>

  <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info text-center">
    <i class="bi bi-exclamation-circle"></i> Your cart is empty.
    <a th:href="@{/products}" class="btn btn-outline-primary ms-2">Shop now</a>
  </div>

  <form th:if="${!#lists.isEmpty(cartItems)}" th:action="@{/order/place}" method="post">
    <div class="row">
      <!-- LEFT: Address Info -->
      <div class="col-md-6">
        <h5 class="mb-3">Billing Address</h5>
        <div class="form-section">
          <div class="row g-2">
            <div class="col-md-6">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" id="firstName" name="billingFirstName" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" id="lastName" name="billingLastName" class="form-control" required>
            </div>
            <div class="col-12">
              <label for="country" class="form-label">Country</label>
              <select id="country" name="billingCountry" class="form-select" required></select>
            </div>
            <div class="col-md-6">
              <label for="stateInput" class="form-label">State / Province</label>
              <input type="text" id="stateInput" name="billingState" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label for="cityInput" class="form-label">City</label>
              <input type="text" id="cityInput" name="billingCity" class="form-control" required>
            </div>
            <div class="col-12">
              <label for="street" class="form-label">Full Street Address</label>
              <input type="text" id="street" name="billingStreet" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" name="billingEmail" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label for="phone" class="form-label">Phone</label>
              <input type="tel" id="phone" name="billingPhone" class="form-control" required>
            </div>
            <div class="col-12">
              <label for="postcode" class="form-label">Postcode / ZIP</label>
              <input type="text" id="postcode" name="billingPostcode" class="form-control">
            </div>
          </div>
        </div>

        <div class="form-check mt-4">
          <input class="form-check-input" type="checkbox" id="shipDifferent" name="shipDifferent">
          <label class="form-check-label" for="shipDifferent">Ship to a different address?</label>
        </div>

        <div id="differentAddress" class="hidden mt-3">
          <h6>Shipping Address</h6>
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label">First Name</label>
              <input type="text" name="shippingFirstName" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Last Name</label>
              <input type="text" name="shippingLastName" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">Country</label>
              <select class="form-select country-select" name="shippingCountry"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">State</label>
              <input type="text" name="shippingState" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">City</label>
              <input type="text" name="shippingCity" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">Street Address</label>
              <input type="text" name="shippingStreet" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="tel" name="shippingPhone" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">Postcode / ZIP</label>
              <input type="text" name="shippingPostcode" class="form-control">
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: Cart & Summary -->
      <div class="col-md-6">
        <div class="table-responsive mb-4">
          <table class="table align-middle">
            <thead class="table-light">
            <tr>
              <th>Product</th>
              <th class="text-end">Price</th>
              <th class="text-center">Qty</th>
              <th class="text-end">Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cartItems}">
              <td th:text="${item.variation.product.name}">Product</td>
              <td class="text-end" th:text="${item.variation.price}">0.00</td>
              <td class="text-center" th:text="${item.quantity}">1</td>
              <td class="text-end fw-semibold" th:text="${item.getSubtotal()}">0.00</td>
              <input type="hidden" name="itemIds" th:value="${item.variation.id}"/>
              <input type="hidden" name="quantities" th:value="${item.quantity}"/>
            </tr>
            </tbody>
          </table>
        </div>

        <div class="summary-box">
          <h5>Order Summary</h5>
          <div class="d-flex justify-content-between">
            <span>Subtotal:</span>
            <span th:text="'$' + ${subtotal}">0.00</span>
          </div>
          <div class="d-flex justify-content-between">
            <span>Shipping:</span>
            <span th:text="'$' + ${shippingFee}">0.00</span>
          </div>
          <div class="d-flex justify-content-between text-success">
            <span>Discount:</span>
            <span th:text="'- $' + ${discount}">0.00</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between fw-bold">
            <span>Total:</span>
            <span th:text="'$' + ${total}">0.00</span>
          </div>

          <!-- Order Notes -->
          <div class="form-group mt-3">
            <label for="orderNote" class="form-label">Order Notes</label>
            <textarea id="orderNote" name="orderNote" class="form-control" rows="3"
                      placeholder="E.g. leave the package at the door."></textarea>
          </div>

          <div class="mt-4 text-end">
            <button type="submit" class="btn btn-confirm">Confirm Order</button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>

<script>
  $(document).ready(function () {
    async function loadCountries(selectId) {
      const response = await fetch("https://countriesnow.space/api/v0.1/countries");
      const data = await response.json();
      const countries = data.data;
      const $select = $(selectId);
      countries.forEach(c => $select.append(new Option(c.country, c.country)));
      $select.select2({ placeholder: "Search country", width: '100%' });
    }

    loadCountries("#country");
    loadCountries(".country-select");

    $('#shipDifferent').on('change', function () {
      $('#differentAddress').toggleClass('hidden', !this.checked);
    });
  });
</script>

</body>
</html>
